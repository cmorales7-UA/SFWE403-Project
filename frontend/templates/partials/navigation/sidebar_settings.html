<!-- This control signs the user out of the system. -->
<form
    action="/logout"
    method="post"
    class="sidebar-signout-form"
>

    <button
        type="submit"
        class="sidebar-settings sidebar-signout"
        aria-label="Sign Out"
        title="Sign Out"
    >

        <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
        </svg>

        <span class="settings-text">
            Sign Out
        </span>

    </button>

</form>
